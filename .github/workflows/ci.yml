name: CI
on:
  push:
    branches: [main, feat/extract-cli-v1-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/constraints.txt
      - run: python -m pip install -c requirements/constraints.txt -e '.[dev]'
      - run: python -m compileall -q src
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest tests/unit -q
  integration:
    name: integration (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements/constraints.txt -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/integration -q
      - run: python -m pytest -q -m 'not e2e'
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -c requirements/constraints.txt '.[dev]' setuptools wheel
      - run: python -m build --no-isolation
      - run: python scripts/wheel_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag prospector-engine:ci .
      - run: docker run --rm --init --shm-size=1g --cap-drop=ALL --security-opt=no-new-privileges prospector-engine:ci python -m prospector_engine.diagnostics
      - run: docker run --rm --init --shm-size=1g --cap-drop=ALL --security-opt=no-new-privileges prospector-engine:ci
